name: Deploy to JetBrains Plugin Repository

on:
  workflow_dispatch:
    inputs:
      channels:
        description: Channels to publish to (comma separated, optional)
        required: false
        default: default

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Read plugin version
        run: echo "PLUGIN_VERSION=$(./gradlew properties --no-daemon --console=plain -q | awk '/^version:/ {print $2}')" >> "$GITHUB_ENV"

      - name: Test and publish plugin
        env:
          PLUGIN_DEPLOYMENT_CHANNELS: ${{ inputs.channels }}
          JETBRAINS_REPO_TOKEN: ${{ secrets.JETBRAINS_REPO_TOKEN }}
          JETBRAINS_REPO_SIGNING_KEY: ${{ secrets.JETBRAINS_REPO_SIGNING_KEY }}
          JETBRAINS_REPO_SIGNING_KEY_PASSWORD: ${{ secrets.JETBRAINS_REPO_SIGNING_KEY_PASSWORD }}
          JETBRAINS_REPO_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_REPO_CERTIFICATE_CHAIN }}
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure publishPlugin

      - name: Create GitHub release
        uses: ncipollo/release-action@v1.20.0
        with:
          artifacts: build/distributions/*.zip
          bodyFile: changenotes.html
          commit: ${{ github.sha }}
          tag: ${{ env.PLUGIN_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
